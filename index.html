<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app-card">

    <!-- Header -->
    <header class="app-header">
      <div class="logo-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 13.5L10 19.5L22 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Student Task Manager</h1>
        <p class="subtitle">Keep your assignments, readings and deadlines in one place.</p>
      </div>
    </header>

    <!-- Add task form -->
    <form id="task-form" class="task-form" autocomplete="off">
      <input
        type="text"
        id="task-input"
        class="task-input"
        placeholder="e.g. Finish Chapter 4 reading notes"
        maxlength="120"
        aria-label="New task description"
      />
      <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

    <!-- Inline validation message for empty input -->
    <p id="form-error" class="form-error" role="alert"></p>

    <!-- Stats -->
    <section class="stats" aria-live="polite">
      <div class="stat">
        <span class="stat-number" id="total-count">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="active-count">0</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="completed-count">0</span>
        <span class="stat-label">Completed</span>
      </div>
    </section>

    <!-- Filters -->
    <nav class="filters" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </nav>

    <!-- Task list -->
    <ul id="task-list" class="task-list"></ul>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <p class="empty-emoji" aria-hidden="true">📚</p>
      <p class="empty-title">No tasks here yet</p>
      <p class="empty-subtitle">Add your first task above to get started.</p>
    </div>

  </main>
<br>
<br>
<br>
<br>

  <footer class="page-footer">
    <p>Built with HTML, CSS ; JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
